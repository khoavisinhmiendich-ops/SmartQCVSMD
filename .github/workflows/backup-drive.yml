name: Sao luu SMART VSMD len Google Drive

on:
  schedule:
    # Mỗi tháng một lần: 19:00 UTC ngày 1 = 02:00 sáng ngày mùng 2 (giờ Việt Nam)
    - cron: '0 19 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'true = luôn tạo bản mới, kể cả khi dữ liệu không đổi'
        required: false
        default: 'false'

concurrency:
  group: backup-drive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sao luu len Google Drive
        run: node scripts/backup-to-drive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_WORKSPACE_ID: ${{ secrets.SUPABASE_WORKSPACE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_KEEP: ${{ secrets.BACKUP_KEEP }}
          BACKUP_FORCE: ${{ github.event.inputs.force }}
